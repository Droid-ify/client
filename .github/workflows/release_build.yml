name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
  push:
    tags:
      - '*'

concurrency:
  group: "release-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - uses: r0adkll/sign-android-release@v1
        name: Signing APK
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASS }}
          keyPassword: ${{ secrets.KEYSTORE_PASS }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      - name: Rename signed APK
        run: mv "${{ steps.sign_app.outputs.signedReleaseFile }}" "app-release.apk"

      - name: Resolve changelog file
        id: changelog
        shell: bash
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          CHANGELOG="metadata/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG" ]; then
            echo "path=$CHANGELOG" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        name: Create Release
        id: publish_release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          files: app-release.apk
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
          make_latest: true
          prerelease: false
          draft: true

      - name: Publish release link
        shell: bash
        env:
          RELEASE_URL: ${{ steps.publish_release.outputs.url }}
        run: |
          echo "::notice title=Release created::${RELEASE_URL}"
          {
            echo "## Release"
            echo ""
            echo "[Open release page](${RELEASE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
